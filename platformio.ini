; PlatformIO Project Configuration File
;
; RoboDawg quadruped controller (ESP32 + PCA9685 servos + wheel ESCs)
;
; Bluetooth gamepads (Bluepad32): use env `esp32dev_gamepad`, which swaps
; in an Arduino-ESP32 core that ships <Bluepad32.h>. See README.
;
; Ref: https://racheldebarros.com/esp32-projects/connect-your-game-controller-to-an-esp32/
; Ref: https://community.platformio.org/t/use-bluepad32-library-in-pio/46745/4

[platformio]
default_envs = esp32s3
; Use `esp32s3` / `esp32s3_gamepad` to target an ESP32-S3 board.

[env]
board = esp32dev
framework = arduino
monitor_speed = 115200
monitor_filters = default, send_on_enter
upload_speed = 921600

build_flags =
    -std=gnu++17
    -Wall
    -Wno-unused-variable
    -Wno-unused-but-set-variable
    ; Comment out the next line to compile out all Serial debug printing.
    ; (Note: we use ROBODAWG_DEBUG rather than DEBUG_SERIAL as the build
    ; flag because Adafruit_BusIO claims the DEBUG_SERIAL macro name for
    ; its own internal diagnostics — config.h re-exports it as a local
    ; macro so the source still reads `#if DEBUG_SERIAL`.)
    -DROBODAWG_DEBUG=1

build_unflags =
    -std=gnu++11

lib_deps =
    adafruit/Adafruit PWM Servo Driver Library@^3.0.2
    adafruit/Adafruit BusIO@^1.16.1
    ; Wire and Preferences are bundled with the ESP32 Arduino core

[env:esp32dev]
platform = espressif32

[env:esp32dev_gamepad]
extends = env:esp32dev
platform = espressif32@6.10.0
; Arduino core repackaged with Bluepad32 (package.json name fixed for PIO).
platform_packages =
    framework-arduinoespressif32@https://github.com/maxgerhardt/pio-framework-bluepad32/archive/refs/heads/main.zip

[env:esp32s3]
platform = espressif32
; Change to whichever S3 board you have, e.g. lolin_s3, esp32s3box, etc.
board = esp32-s3-devkitc-1
; S3 USB-CDC: Serial routes over the native USB port on boot.
; Remove these two flags if using a UART-to-USB adapter on the UART0 pins.
build_flags =
    ${env.build_flags}
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
; Native USB upload — switch to `esptool` if using a UART adapter instead.
upload_protocol = esp-builtin

[env:esp32s3_gamepad]
extends = env:esp32s3
platform = espressif32@6.10.0
platform_packages =
    framework-arduinoespressif32@https://github.com/maxgerhardt/pio-framework-bluepad32/archive/refs/heads/main.zip
